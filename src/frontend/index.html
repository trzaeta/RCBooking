<!doctype html>
<html>
  <head>
    <title>Research Congress Booking</title>
    <link rel="stylesheet" href="index.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <div class="header">
      <p class="version">Version 0.1</p>
      <p class="pageTitle">
        <strong>Research Congress Booking</strong>
      </p>
    </div>
    <div class="mainWindow" id="mainWindow">test</div>
    <div class="rc">
      <div class="bg"></div>
      <button
        id="rb"
        class="option"
        onclick="select(this)"
        onmouseenter="hover(this)"
        onmouseleave="unhover(this)"
      >
        Request Booking</button
      ><br />
      <button
        id="socr"
        class="option"
        onclick="select(this)"
        onmouseenter="hover(this)"
        onmouseleave="unhover(this)"
      >
        Status of current request</button
      ><br />
      <button
        id="pa"
        class="option"
        onclick="select(this)"
        onmouseenter="hover(this)"
        onmouseleave="unhover(this)"
      >
        Past applications</button
      ><br />
    </div>
  </body>
</html>
