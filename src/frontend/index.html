<!doctype html>
<html>
  <head>
    <title>Research Congress Booking</title>
    <link rel="stylesheet" href="index.css" />
    <script src="api.js?v=20260811-teacher-review" defer></script>
    <script src="index.js?v=20260811-student-history" defer></script>
  </head>
  <body>
    <div class="header">
      <p class="version">Version 0.1</p>
      <div class="accountSwitcher">
        <label for="roleSelect">Login as</label>
        <select id="roleSelect" aria-label="Login role">
          <option value="student" selected>Student</option>
          <option value="teacher">Teacher</option>
        </select>
        <span id="currentUserName" role="status" aria-live="polite">Signing in...</span>
      </div>
      <p class="pageTitle">
        <strong>Research Congress Booking</strong>
      </p>
    </div>
    <div class="mainWindow" id="mainWindow">
      If you see this, then something is very, very wrong.
    </div>
    <div class="rc">
      <div class="bg"></div>
      <button
        id="rb"
        class="option"
        onclick="select(this)"
        onmouseenter="hover(this)"
        onmouseleave="unhover(this)"
      >
        Request Booking</button
      ><br />
      <button
        id="socr"
        class="option"
        onclick="select(this)"
        onmouseenter="hover(this)"
        onmouseleave="unhover(this)"
      >
        Status of current request</button
      ><br />
      <button
        id="pa"
        class="option"
        onclick="select(this)"
        onmouseenter="hover(this)"
        onmouseleave="unhover(this)"
      >
        Past applications</button
      ><br />
    </div>
  </body>
</html>
